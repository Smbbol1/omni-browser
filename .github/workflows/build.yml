name: Build ARM v8 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compila usando el wrapper del proyecto con la tarea estándar Debug
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          set -e
          mkdir -p output
          echo "=== APKs generados ==="
          find . -name "*.apk"
          APK_FILE=$(find . -name "*arm64-v8a*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" ! -name "*unsigned*" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "Error: No se encontró ningún APK firmado."
            exit 1
          fi
          echo "=== APK seleccionado: $APK_FILE ==="
          cp "$APK_FILE" output/ClintBrowser-ARMv8-debug.apk

      # GitHub ya lo empaqueta en un solo ZIP automáticamente
      - name: Upload APK to Summary
        uses: actions/upload-artifact@v4
        with:
          name: ClintBrowser-ARMv8-APK
          path: output/ClintBrowser-ARMv8-debug.apk
          retention-days: 7

      - name: Generate Summary
        run: |
          echo "### ✅ Compilación Exitosa" >> $GITHUB_STEP_SUMMARY
          echo "Descarga tu APK haciendo clic en la sección **Artifacts** al final de esta página (solo requiere descomprimir una vez)." >> $GITHUB_STEP_SUMMARY
          echo "| Archivo | Ubicación |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **ClintBrowser-ARMv8-APK.zip** | Sección Artifacts (abajo) |" >> $GITHUB_STEP_SUMMARY
